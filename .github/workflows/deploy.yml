name: iOS Deploy to TestFlight

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - name: Setup Keychain
        run: |
          KEYCHAIN_NAME="fastlane_tmp_keychain.keychain-db"
          KEYCHAIN_PASSWORD=""
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          
          # 1. 키체인 생성
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # 2. 검색 리스트에 추가
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning
          
          # 🚨 [추가된 부분] Apple WWDR 인증서(G3) 다운로드 및 설치
          # 이게 있어야 님의 인증서가 "유효하다"고 인정받습니다.
          curl -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          
          # 3. 환경 변수 등록
          echo "KEYCHAIN_NAME=$KEYCHAIN_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          echo "✅ Keychain setup complete with WWDR certificate."

      - name: Create Secrets.xcconfig
        run: |
          touch Secrets.xcconfig
          echo "// Generated by CI" >> Secrets.xcconfig

      - name: Install Tuist
        uses: jdx/mise-action@v2
        with:
          tool_versions: |
            tuist latest

      - name: Generate Project
        run: |
          tuist generate


      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Deploy to TestFlight
        env:
          MATCH_PASSWORD: ${{ secrets.FASTLANE_MATCH_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          RAW_GIT_TOKEN: ${{ secrets.FASTLANE_MATCH_GIT_AUTHORIZATION }}
          
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 600
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5
        run: |
          AUTH_STRING="99Page:$RAW_GIT_TOKEN"
          AUTH_BASE64=$(echo -n "$AUTH_STRING" | base64)
          export MATCH_GIT_BASIC_AUTHORIZATION="$AUTH_BASE64"
          
          echo "✅ Auth token generated successfully."
          
          bundle install
          bundle exec fastlane beta