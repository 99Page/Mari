name: iOS Unit Test

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # ⚠️ Xcode 버전 확인: 현재 15.2로 설정됨.
      # 프로젝트가 요구하는 버전이 다르면 수정 필요 (예: 15.0, 16.0 등)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme "Rim" \
            -destination "platform=iOS Simulator,name=iPhone 15 Pro,OS=latest" \
            -clean \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
