name: iOS Unit Test

on:

  workflow_dispatch:
  
  pull_request:
    branches: [ "release*" ]
  push:
    branches: [ "release*" ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest # GitHub에서 제공하는 최신 macOS 사용
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 🚀 최신 Xcode 안정화 버전을 자동으로 세팅해주는 플러그인 사용
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -scheme "Rim" \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=latest" \
            -clean \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
